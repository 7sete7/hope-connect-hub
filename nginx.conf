server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads de imagem (backend limita a 5MB; padrão do nginx é 1MB)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files proxy (^~ impede que o regex de estáticos abaixo capture .jpg/.png daqui)
    location ^~ /uploads/ {
        proxy_pass http://backend:3001;
        expires 30d;
    }

    # Build do Vite: nomes com hash, podem ser cacheados para sempre
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Demais estáticos de /public (logos etc.): sem hash, cache curto
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
